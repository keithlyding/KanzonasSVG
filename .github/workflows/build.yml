name: Build Windows and Linux apps

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# The build jobs only read; only publish writes (the release and its tag).
permissions:
  contents: read

# A newer push to the same branch cancels the older build (not on main: a release in the middle
# of publishing would be left half done).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Windows: the program folder (KanzonasSVG.exe and kanzonassvg-cli.exe) as a zip
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt pyinstaller

      - name: Build the tracing engine (C/C++, Visual Studio)
        run: python tools/build_engine.py

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_*.py" -t .

      - name: Build the program folder (PyInstaller)
        run: python -m PyInstaller --noconfirm packaging/kanzonassvg.spec

      - name: License files
        shell: pwsh
        run: |
          Copy-Item LICENSE dist\KanzonasSVG\LICENSE.txt
          Copy-Item NOTICE.md dist\KanzonasSVG\NOTICE.txt

      - name: Self test (inside the exe)
        shell: pwsh
        run: |
          $p = Start-Process dist\KanzonasSVG\KanzonasSVG.exe -ArgumentList "--selftest","selftest.log" -PassThru -Wait
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { throw "Self test failed with code $($p.ExitCode)" }

      - name: Command line (kanzonassvg-cli.exe)
        shell: pwsh
        run: |
          dist\KanzonasSVG\kanzonassvg-cli.exe --version
          if ($LASTEXITCODE) { throw "--version failed" }
          python -c "from tests import helpers; helpers.logo().save('cli-test.png')"
          dist\KanzonasSVG\kanzonassvg-cli.exe --colors 4 cli-test.png -o cli-test.svg
          if ($LASTEXITCODE) { throw "tracing from the command line failed" }
          if (-not (Select-String -Path cli-test.svg -Pattern "#b2002d" -Quiet)) { throw "wrong SVG" }

      - name: Smoke test (the window starts and opens a picture)
        shell: pwsh
        run: |
          $p = Start-Process dist\KanzonasSVG\KanzonasSVG.exe -ArgumentList "cli-test.png" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "The app exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import kanzonassvg; print(kanzonassvg.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\KanzonasSVG -DestinationPath KanzonasSVG-windows.zip

      - uses: actions/upload-artifact@v6
        with:
          name: KanzonasSVG-v${{ steps.ver.outputs.version }}-windows
          path: KanzonasSVG-windows.zip
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: windows-selftest-log
          path: selftest.log
          if-no-files-found: ignore

  # Linux: an AppImage, built on the oldest system it supports (Ubuntu 22.04)
  linux:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      # appimagetool pinned to an exact release file and checked against its SHA-256; the
      # AppImage runtime is cut from it (its first APPIMAGE_RUNTIME_BYTES bytes, pinned too).
      # Update both together.
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: 46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1
      APPIMAGE_RUNTIME_BYTES: "692512"
      APPIMAGE_RUNTIME_SHA256: 33a0fb9c4e2477d0cf1994a179e983633f3b3e77876b190bacff32f335551091
      # the build fails if a bundled file needs a newer glibc or C++ runtime than Ubuntu 22.04's
      MAX_GLIBC: "2.35"
      MAX_GLIBCXX: "3.4.30"
      MAX_CXXABI: "1.3.13"
      MAX_LIBGCC: "12.0.0"
      MAX_APPIMAGE_MB: "120"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries (bundled into the AppImage) and test tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libegl1 libgl1 libopengl0 libdbus-1-3 libfontconfig1 libgtk-3-0 \
            xvfb xauth appstream desktop-file-utils cmake

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt pyinstaller

      - name: Build the tracing engine (C/C++)
        run: python tools/build_engine.py

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_*.py" -t .

      - name: Build the program folder (PyInstaller)
        run: python -m PyInstaller --noconfirm packaging/kanzonassvg.spec

      - name: License files
        run: |
          cp LICENSE dist/KanzonasSVG/LICENSE.txt
          cp NOTICE.md dist/KanzonasSVG/NOTICE.txt

      - name: Read version
        id: ver
        run: echo "version=$(python -c 'import kanzonassvg; print(kanzonassvg.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Fetch appimagetool and the AppImage runtime (pinned, checked)
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tools/appimagetool-x86_64.AppImage" "$APPIMAGETOOL_URL"
          got=$(sha256sum "$RUNNER_TEMP/tools/appimagetool-x86_64.AppImage" | cut -d' ' -f1)
          if [ "$got" != "$APPIMAGETOOL_SHA256" ]; then
            echo "::error::appimagetool has SHA-256 $got, not the pinned $APPIMAGETOOL_SHA256"; exit 1
          fi
          chmod +x "$RUNNER_TEMP/tools/appimagetool-x86_64.AppImage"
          head -c "$APPIMAGE_RUNTIME_BYTES" "$RUNNER_TEMP/tools/appimagetool-x86_64.AppImage" > "$RUNNER_TEMP/tools/runtime-x86_64"
          got=$(sha256sum "$RUNNER_TEMP/tools/runtime-x86_64" | cut -d' ' -f1)
          if [ "$got" != "$APPIMAGE_RUNTIME_SHA256" ]; then
            echo "::error::the runtime has SHA-256 $got, not the pinned $APPIMAGE_RUNTIME_SHA256"; exit 1
          fi

      - name: Make the AppImage (AppDir, excluded libraries, compatibility checks)
        run: |
          python packaging/linux/make_appimage.py dist/KanzonasSVG AppDir \
            --version "${{ steps.ver.outputs.version }}" \
            --max-glibc "$MAX_GLIBC" --max-glibcxx "$MAX_GLIBCXX" \
            --max-cxxabi "$MAX_CXXABI" --max-libgcc "$MAX_LIBGCC" \
            --appimagetool "$RUNNER_TEMP/tools/appimagetool-x86_64.AppImage" \
            --runtime-file "$RUNNER_TEMP/tools/runtime-x86_64" \
            --output KanzonasSVG-x86_64.AppImage

      - name: Check the AppImage (size, contents)
        run: |
          size=$(stat -c %s KanzonasSVG-x86_64.AppImage)
          echo "KanzonasSVG-x86_64.AppImage: $((size / 1000000)) MB"
          if [ "$size" -gt $((MAX_APPIMAGE_MB * 1000000)) ]; then
            echo "::error::The AppImage is bigger than $MAX_APPIMAGE_MB MB"; exit 1
          fi
          rm -rf squashfs-root
          ./KanzonasSVG-x86_64.AppImage --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          test -f squashfs-root/kanzonassvg.desktop
          test -f squashfs-root/usr/lib/KanzonasSVG/LICENSE.txt
          test -f squashfs-root/usr/lib/KanzonasSVG/NOTICE.txt
          rm -rf squashfs-root

      - name: Self test (inside the AppImage)
        run: |
          code=0
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            ./KanzonasSVG-x86_64.AppImage --appimage-extract-and-run --selftest selftest-linux.log || code=$?
          cat selftest-linux.log
          if [ $code -ne 0 ]; then echo "::error::Self test failed with code $code"; exit 1; fi

      - name: Command line (inside the AppImage)
        run: |
          python -c "from tests import helpers; helpers.logo().save('cli-test.png')"
          ./KanzonasSVG-x86_64.AppImage --appimage-extract-and-run --colors 4 cli-test.png -o cli-test.svg
          grep -q '#b2002d' cli-test.svg
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Smoke test (the AppImage starts and opens a picture)
        run: packaging/linux/smoke_test.sh ./KanzonasSVG-x86_64.AppImage --appimage-extract-and-run

      - uses: actions/upload-artifact@v6
        with:
          name: KanzonasSVG-v${{ steps.ver.outputs.version }}-linux
          path: KanzonasSVG-x86_64.AppImage
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: linux-selftest-log
          path: selftest-linux.log
          if-no-files-found: ignore

  # A push to main with a new version number publishes a release with both downloads.
  publish:
    needs: [windows, linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Same version on Windows and Linux
        run: |
          test -n "$VERSION"
          test "$VERSION" = "${{ needs.linux.outputs.version }}"

      - name: Is this version already released?
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then new=false; else new=true; fi
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION: new release = $new"

      - uses: actions/download-artifact@v6
        if: steps.rel.outputs.new == 'true'
        with:
          name: KanzonasSVG-v${{ env.VERSION }}-windows
          path: release

      - uses: actions/download-artifact@v6
        if: steps.rel.outputs.new == 'true'
        with:
          name: KanzonasSVG-v${{ env.VERSION }}-linux
          path: release

      - name: Release notes and checksums
        if: steps.rel.outputs.new == 'true'
        run: |
          python3 - "$VERSION" > notes.md <<'PY'
          import re, sys
          v = sys.argv[1]
          text = open("RELEASE_NOTES.md", encoding="utf-8").read()
          m = re.search(r"^## +%s *$(.*?)(?=^## |\Z)" % re.escape(v), text, re.M | re.S)
          if not m or not m.group(1).strip():
              sys.exit("RELEASE_NOTES.md has no notes for %s" % v)
          print(m.group(1).strip())
          PY
          cd release
          chmod +x KanzonasSVG-x86_64.AppImage
          sha256sum KanzonasSVG-windows.zip KanzonasSVG-x86_64.AppImage > ../SHA256SUMS.txt
          cd ..
          {
            echo
            echo "**Windows:** download \`KanzonasSVG-windows.zip\`, unzip it anywhere and run \`KanzonasSVG.exe\`"
            echo "(\`kanzonassvg-cli.exe\` in the same folder is the command line)."
            echo "**Linux (64-bit; Ubuntu 22.04 or newer):** download \`KanzonasSVG-x86_64.AppImage\`, make it"
            echo "executable (\`chmod +x\`) and run it."
            echo
            echo "**SHA-256:**"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> notes.md
          cat notes.md

      - name: Publish release
        if: steps.rel.outputs.new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: KanzonasSVG ${{ env.VERSION }}
          body_path: notes.md
          files: |
            SHA256SUMS.txt
            release/KanzonasSVG-windows.zip
            release/KanzonasSVG-x86_64.AppImage
